<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop All | Just One Layer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-text { background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-sky-500 selection:text-white">

    <!-- Navigation -->
    <header class="sticky top-0 z-50 glass border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-2">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-400 to-indigo-500 flex items-center justify-center font-extrabold text-xl text-slate-950 shadow-lg">J</div>
                <span class="text-xl font-black tracking-tight text-white">JUST ONE <span class="gradient-text">LAYER</span></span>
            </a>
            <nav class="hidden md:flex items-center space-x-8 font-medium text-slate-300">
                <a href="index.html" class="hover:text-sky-400 transition">Home</a>
                <a href="shop.html" class="text-sky-400 font-semibold transition">Shop All</a>
                <a href="story.html" class="hover:text-sky-400 transition">Our Story</a>
                <a href="faq.html" class="hover:text-sky-400 transition">FAQ</a>
                <a href="guide.html" class="hover:text-sky-400 transition">Guide</a>
            </nav>
            <div class="flex items-center space-x-4">
                <a href="#cart" class="relative bg-slate-800/80 hover:bg-slate-700 text-white p-3 rounded-full border border-slate-700 transition flex items-center justify-center">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span id="cart-badge" class="absolute -top-1 -right-1 bg-sky-500 text-slate-950 text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center shadow">0</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Shop Container -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
        <div class="text-center mb-10">
            <h1 class="text-3xl sm:text-5xl font-extrabold text-white mb-4">Explore Our Catalog</h1>
            <p class="text-slate-400 max-w-xl mx-auto">From high-speed decals to cozy hoodies and soothing donkey milk soap.</p>
        </div>

        <!-- Filter Buttons -->
        <div class="flex flex-wrap justify-center gap-3 mb-12" id="filter-container">
            <button onclick="filterProducts('all')" class="filter-btn px-6 py-2.5 rounded-full font-semibold text-sm bg-sky-500 text-slate-950 transition shadow-lg">All Items</button>
            <button onclick="filterProducts('apparel')" class="filter-btn px-6 py-2.5 rounded-full font-semibold text-sm glass hover:bg-slate-800 text-slate-300 transition">Apparel</button>
            <button onclick="filterProducts('auto')" class="filter-btn px-6 py-2.5 rounded-full font-semibold text-sm glass hover:bg-slate-800 text-slate-300 transition">Auto & Decals</button>
            <button onclick="filterProducts('accessories')" class="filter-btn px-6 py-2.5 rounded-full font-semibold text-sm glass hover:bg-slate-800 text-slate-300 transition">Accessories</button>
            <button onclick="filterProducts('selfcare')" class="filter-btn px-6 py-2.5 rounded-full font-semibold text-sm glass hover:bg-slate-800 text-slate-300 transition">Self-Care</button>
        </div>

        <!-- Product Grid -->
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 mb-20">
            <!-- Dynamic Products Injected via JS -->
        </div>

        <!-- Curated Bundles Section -->
        <div id="bundles" class="pt-10 border-t border-slate-800 mb-20">
            <div class="text-center mb-12">
                <span class="text-sky-400 font-semibold text-sm uppercase tracking-wider">Save Big</span>
                <h2 class="text-3xl font-extrabold text-white mt-2">Curated Bundles & Packages</h2>
            </div>
            <div id="bundle-grid" class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <!-- Dynamic Bundles Injected via JS -->
            </div>
        </div>

        <!-- Shopping Cart Section -->
        <div id="cart" class="glass rounded-2xl p-6 sm:p-8 border border-slate-700/60 max-w-4xl mx-auto">
            <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-800">
                <h2 class="text-2xl font-bold text-white flex items-center">
                    <i class="fa-solid fa-cart-shopping text-sky-400 mr-3"></i> Your Shopping Cart
                </h2>
                <button onclick="clearCart()" class="text-sm text-red-400 hover:text-red-300 font-medium">Clear Cart</button>
            </div>
            <div id="cart-items" class="divide-y divide-slate-800 mb-6">
                <!-- Dynamic Cart Items -->
            </div>
            <div class="flex flex-col sm:flex-row justify-between items-center pt-4 border-t border-slate-800 gap-4">
                <div class="text-xl font-bold text-white">
                    Total: <span id="cart-total" class="text-sky-400">$0.00</span>
                </div>
                <button onclick="checkout()" class="w-full sm:w-auto px-8 py-3.5 rounded-xl bg-gradient-to-r from-sky-500 to-indigo-600 text-white font-bold shadow-lg hover:opacity-90 transition">
                    Proceed to Checkout <i class="fa-solid fa-lock ml-2 text-xs"></i>
                </button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-950 border-t border-slate-800 py-12 text-slate-400 text-sm mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <p>&copy; 2026 Just One Layer. All rights reserved. Built for creators and car culture.</p>
        </div>
    </footer>

    <script src="store-data.js"></script>
</body>
</html>
